name: Build Abdes TV APKs (Mobile & Android TV)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Compile Abdes TV Mobile & Android TV APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Generate Release Signing Keystore (for installable Release APKs)
        run: |
          mkdir -p keystore
          if [ ! -f keystore/abdestv-release.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/abdestv-release.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias abdestv \
              -storepass AbdesTv2026! \
              -keypass AbdesTv2026! \
              -dname "CN=Abdes TV, OU=Media, O=AbdesTV, L=Casablanca, S=Casablanca-Settat, C=MA"
          fi

      - name: 6. Build Mobile & Android TV Release and Debug APKs
        run: |
          gradle :mobile:assembleRelease :tv:assembleRelease :mobile:assembleDebug :tv:assembleDebug --stacktrace

      - name: 7. Package & Verify Deliverable APKs
        run: |
          mkdir -p dist/Mobile dist/Android-TV
          cp mobile/build/outputs/apk/release/mobile-release.apk dist/Mobile/Abdes-TV-Mobile.apk
          cp tv/build/outputs/apk/release/tv-release.apk dist/Android-TV/Abdes-TV-Android-TV.apk
          cp mobile/build/outputs/apk/release/mobile-release.apk Abdes-TV-Mobile.apk
          cp tv/build/outputs/apk/release/tv-release.apk Abdes-TV-Android-TV.apk
          ls -lh Abdes-TV-Mobile.apk Abdes-TV-Android-TV.apk

      - name: 8. Upload Abdes-TV-Mobile.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abdes-TV-Mobile
          path: Abdes-TV-Mobile.apk
          if-no-files-found: error

      - name: 9. Upload Abdes-TV-Android-TV.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abdes-TV-Android-TV
          path: Abdes-TV-Android-TV.apk
          if-no-files-found: error

      - name: 10. Upload Combined Delivery Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ABDES-TV-COMPLETE-APKS
          path: |
            Abdes-TV-Mobile.apk
            Abdes-TV-Android-TV.apk
          if-no-files-found: error
